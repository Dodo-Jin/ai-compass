<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파이프라인 보관함 | AI Compass</title>
  <link href="/assets/vendor/flexstart/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/flexstart/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/vendor/flexstart/css/main.css" rel="stylesheet">
  <link href="/assets/css/common.css" rel="stylesheet">
  <link href="/assets/css/pipeline.css" rel="stylesheet">
</head>
<body class="pl-page">
  <div id="header"></div>

  <main>
    <div class="pl-title">
      <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h1>마이페이지
          <span id="mock-badge" class="badge text-bg-warning align-middle fs-6 fw-normal ms-2" title="백엔드 연동 전 임시 데이터로 동작 중이에요" hidden>목 데이터</span>
        </h1>
        <nav aria-label="현재 위치">
          <ol class="pl-crumbs"><li><a href="/">Home</a></li><li aria-current="page">My Page</li></ol>
        </nav>
      </div>
    </div>

    <div class="container pb-5">
      <div class="row g-4 align-items-start">
        <!-- 프로필 -->
        <aside class="col-lg-3" aria-label="내 정보 요약">
          <div class="pl-profile">
            <div class="pl-profile-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></div>
            <h2 id="profile-name">회원</h2>
            <p id="profile-email" class="email" hidden></p>
            <ul class="pl-stats">
              <li><span>저장한 파이프라인</span><strong id="stat-pipelines">–</strong></li>
              <li><span>즐겨찾기 툴</span><strong id="stat-favorites">–</strong></li>
              <li><span>작성한 리뷰</span><strong id="stat-reviews">–</strong></li>
            </ul>
          </div>
        </aside>

        <!-- 보관함 -->
        <div class="col-lg-9">
          <div class="pl-panel">
            <div class="pl-panel-body px-4 px-xl-5 pt-3">
              <!-- 탭 주소: 내 정보 / 즐겨찾기 비교 페이지는 각 담당자가 만들 때 맞춘다 -->
              <ul class="pl-tabs">
                <li><a href="/pages/mypage/index.html">내 정보</a></li>
                <li><a href="/pages/mypage/favorites.html">즐겨찾기 비교</a></li>
                <li><a class="active" href="/pages/mypage/library.html" aria-current="page">파이프라인 보관함</a></li>
              </ul>

              <div class="pl-toolbar">
                <div class="pl-search">
                  <i class="bi bi-search" aria-hidden="true"></i>
                  <input id="q" type="search" class="form-control" placeholder="제목 검색…" aria-label="제목 검색" autocomplete="off">
                </div>
                <select id="sort" class="form-select" aria-label="정렬">
                  <option value="latest">최신순</option>
                  <option value="oldest">오래된 순</option>
                  <option value="title">제목순</option>
                </select>
                <div class="pl-seg" role="group" aria-label="보기 방식">
                  <button id="view-card" type="button">카드</button>
                  <button id="view-list" type="button">리스트</button>
                </div>
                <a class="pl-btn pl-btn-primary" href="/pages/chatbot/chat.html"><i class="bi bi-plus-lg" aria-hidden="true"></i>새 파이프라인</a>
              </div>

              <p id="summary" class="text-muted small mb-3" tabindex="-1" aria-live="polite"></p>
              <div id="content"></div>
              <nav aria-label="페이지 이동"><ul id="pager" class="pl-pager"></ul></nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 삭제 확인 -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-title">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="delete-title">파이프라인 삭제</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1">‘<strong id="delete-name"></strong>’ 파이프라인을 삭제할까요?</p>
          <p class="text-muted small mb-0">삭제하면 되돌릴 수 없어요.</p>
          <div id="delete-error" class="mt-3" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="pl-btn pl-btn-sm" data-bs-dismiss="modal">취소</button>
          <button id="delete-confirm" type="button" class="pl-btn pl-btn-sm pl-btn-danger">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/assets/vendor/flexstart/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common/layout.js"></script>
  <script type="module" src="/assets/js/chatbot/library.js"></script>
</body>
</html>
