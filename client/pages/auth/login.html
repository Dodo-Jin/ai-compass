<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | AI Compass</title>
  <link href="/assets/vendor/flexstart/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/flexstart/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/vendor/flexstart/css/main.css" rel="stylesheet">
  <link href="/assets/css/common.css" rel="stylesheet">
  <style>
    body {
      background: var(--pl-bg, #f5f8ff);
    }
    .auth-wrap {
      min-height: calc(100vh - 210px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid var(--pl-line, rgba(1, 41, 112, 0.08));
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(1, 41, 112, 0.06);
      padding: 36px 32px;
    }
    .auth-title {
      font-family: var(--heading-font, 'Nunito', sans-serif);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--heading-color, #012970);
      margin-bottom: 6px;
    }
    .auth-sub {
      color: #6c757d;
      font-size: 0.92rem;
      margin-bottom: 24px;
    }
    .auth-submit {
      width: 100%;
      padding: 11px 16px;
      font-family: var(--nav-font, 'Poppins', sans-serif);
      font-weight: 600;
      border-radius: 10px;
      background: var(--accent-color, #4154f1);
      border-color: var(--accent-color, #4154f1);
    }
    .auth-submit:hover {
      background: #3345d6;
      border-color: #3345d6;
    }
    .auth-link {
      color: var(--accent-color, #4154f1);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="text-center mb-3">
        <span class="badge rounded-pill px-3 py-2 mb-2" style="background:#f4f6ff;color:var(--accent-color,#4154f1);border:1px solid rgba(65,84,241,0.14);">AI Compass</span>
        <h1 class="auth-title">로그인</h1>
        <p class="auth-sub mb-0">계정에 로그인하고 AI 툴 리뷰와 마이페이지를 이용해 보세요.</p>
      </div>

      <div id="auth-alert" class="alert d-none py-2 small" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small">이메일</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small">비밀번호</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary auth-submit">로그인</button>
      </form>

      <div class="text-center mt-4 pt-3 small text-muted" style="border-top:1px solid var(--pl-line, rgba(1,41,112,0.08));">
        아직 계정이 없으신가요?
        <a href="/pages/auth/signup.html" class="auth-link ms-1">회원가입</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/assets/vendor/flexstart/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common/layout.js"></script>
  <script>
    (async function () {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('auth-alert');

      function showAlert(message, type = 'danger') {
        alertBox.className = `alert alert-${type} py-2 small`;
        alertBox.textContent = message;
      }

      function getSafeRedirect(fallback) {
        const redirect = new URLSearchParams(location.search).get('redirect');
        if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
          return redirect;
        }
        return fallback;
      }

      // 이미 로그인된 경우 헤더 반영 후 리다이렉트
      try {
        await window.layoutReady;
        const meRes = await fetch('/api/v1/users/me', { credentials: 'same-origin' });
        if (meRes.ok) {
          const meJson = await meRes.json();
          if (meJson.success && meJson.data) {
            const headerUser = document.getElementById('header-user');
            if (headerUser) {
              headerUser.href = '/pages/mypage/index.html';
              const nameEl = headerUser.querySelector('.pl-user-name');
              if (nameEl) nameEl.textContent = meJson.data.username;
            }
            location.replace(getSafeRedirect('/pages/mypage/index.html'));
            return;
          }
        }
      } catch (_) {}

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'alert d-none py-2 small';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('이메일과 비밀번호를 모두 입력해 주세요.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '로그인 중...';

        try {
          const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email, password })
          });
          const json = await res.json().catch(() => ({}));

          if (!res.ok || !json.success) {
            showAlert(json.error?.message || '이메일 또는 비밀번호가 올바르지 않습니다.');
            return;
          }

          location.href = getSafeRedirect('/pages/directory/list.html');
        } catch (_) {
          showAlert('서버와 통신할 수 없습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '로그인';
        }
      });
    })();
  </script>
</body>
</html>
